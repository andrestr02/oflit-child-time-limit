<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
	<!--
	  Only root (the systemd-managed backend itself) may own this name.
	  Any local user may attempt a method call or introspect the object;
	  actual authorization for every call is decided by Polkit inside the
	  backend (see id.oflit.ChildTime1.policy), not by this bus policy.
	-->
	<policy user="root">
		<allow own="id.oflit.ChildTime1"/>
	</policy>
	<policy context="default">
		<deny own="id.oflit.ChildTime1"/>
		<allow send_destination="id.oflit.ChildTime1"
		       send_interface="id.oflit.ChildTime1"/>
		<allow send_destination="id.oflit.ChildTime1"
		       send_interface="org.freedesktop.DBus.Introspectable"/>
		<allow send_destination="id.oflit.ChildTime1"
		       send_interface="org.freedesktop.DBus.Properties"/>
	</policy>
</busconfig>
